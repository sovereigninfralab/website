# Keeps the pinned GitHub Actions in .github/workflows/ up to date.
# The site itself has no package dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised
    # release has time to be found and pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
