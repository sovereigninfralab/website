# Checks the published site in site/ on every pull request and push to main,
# and once a week so an expiring security.txt is caught. See tools/check_site.py.
name: Site check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the site
        run: python3 tools/check_site.py
